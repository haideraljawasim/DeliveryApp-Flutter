name: deliveryapp_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0
  get_it: ^9.2.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0

flutter:
  fonts:
    - family: Brandon Grotesque
      fonts:
        - asset: assets/fonts/brandon_grotesque_thin.otf
        - asset: assets/fonts/brandon_grotesque_light.otf
        - asset: assets/fonts/brandon_grotesque_regular.otf
        - asset: assets/fonts/brandon_grotesque_medium.otf
        - asset: assets/fonts/brandon_grotesque_bold.otf
        - asset: assets/fonts/brandon_grotesque_black.otf

  assets:
    - assets/images/

  uses-material-design: true

flutter_native_splash:
  color: "#FFFFFF"
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
